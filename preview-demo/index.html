<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
      display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    main { text-align: center; padding: 2rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
    p { opacity: .8; }
    code { background: #1e293b; padding: .2rem .45rem; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Fullstack preview OK</h1>
    <p>Trang local trên Mac, mở qua Cloudflare Tunnel.</p>
    <p><code id="t"></code></p>
  </main>
  <script>document.getElementById('t').textContent = new Date().toLocaleString('vi-VN');</script>
</body>
</html>
